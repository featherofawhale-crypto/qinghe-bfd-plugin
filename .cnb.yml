main:
  push:
    - stages:
        - name: 下载 beta26 发布资产
          image: curlimages/curl:8.10.1
          script: |
            curl -L --fail --retry 3 -o qinghe-toolbox-v2.0.1-beta.26-macos.dmg "https://github.com/featherofawhale-crypto/qinghe-bfd-plugin/releases/download/v2.0.1-beta.26/qinghe-toolbox-v2.0.1-beta.26-macos.dmg"
            curl -L --fail --retry 3 -o QingheBFD_v2.0.1-beta.26_Windows_Setup.exe "https://github.com/featherofawhale-crypto/qinghe-bfd-plugin/releases/download/v2.0.1-beta.26/QingheBFD_v2.0.1-beta.26_Windows_Setup.exe"
            test "$(sha256sum qinghe-toolbox-v2.0.1-beta.26-macos.dmg | cut -d' ' -f1)" = "00ca2fb57da44f0b2248c9e5c2379551d36afa6f36bc13abc6e521395d49e009"
            test "$(sha256sum QingheBFD_v2.0.1-beta.26_Windows_Setup.exe | cut -d' ' -f1)" = "23e474eb86cdafca29695f079cbf544ab1a422b93c5dfbc903729dfd50ba9309"

        - name: 更新 beta26 发布说明
          type: git:release
          options:
            overlying: true
            tag: latest
            title: 清何剪辑工具箱 v2.0.1-beta.26
            description: |
              macOS beta26：修复当前时间线 Text+ 扫描为空、Resolve bridge worker 缺少正则模块和 Fusion 合成重复识别；扫描跟随 Resolve 当前时间线。保留字体中文/英文双名称、字体缓存与手动刷新、不可用字体诊断、BPM 缓存及完整打包依赖。

              Windows beta26：提供独立一键安装器。
            preRelease: true
            latest: true

        - name: 上传 beta26 Release 附件
          image: cnbcool/attachments:latest
          settings:
            tag: latest
            attachments:
              - qinghe-toolbox-v2.0.1-beta.26-macos.dmg
              - QingheBFD_v2.0.1-beta.26_Windows_Setup.exe
              - latest.json
